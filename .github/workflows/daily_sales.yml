name: Next Engine 売上速報

on:
  schedule:
    - cron: '30 21 * * *'  # 毎日 21:30 UTC（約2h遅延を見込み） = 翌 8:30 JST 着
  workflow_dispatch:        # 手動実行ボタンも有効化

jobs:
  report:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next-engine-sales

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily sales report
        env:
          NE_ACCESS_TOKEN:  ${{ secrets.NE_ACCESS_TOKEN }}
          NE_REFRESH_TOKEN: ${{ secrets.NE_REFRESH_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL_WEBDIV: ${{ secrets.SLACK_WEBHOOK_URL_WEBDIV }} 
          NE_TOKEN_OUTPUT: /tmp/ne_tokens.json
        run: python daily_sales.py

      - name: Refresh NE tokens in Secrets
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -f /tmp/ne_tokens.json ]; then
            gh secret set NE_ACCESS_TOKEN --body "$(jq -r .access_token /tmp/ne_tokens.json)"
            gh secret set NE_REFRESH_TOKEN --body "$(jq -r .refresh_token /tmp/ne_tokens.json)"
            echo "NEトークンをSecretsに更新しました"
          fi
