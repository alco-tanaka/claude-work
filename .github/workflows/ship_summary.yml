name: NE出荷実績の集計（読み取りのみ）

on:
  workflow_dispatch:
    inputs:
      since:
        description: 'この日時以降を集計'
        required: false
        default: '2026-10-27 18:00:00'
      until:
        description: 'この日時より前だけ集計（空なら現在まで）例: 2026-10-31 00:00:00'
        required: false
        default: ''

concurrency:
  group: ne-token
  cancel-in-progress: false

jobs:
  summary:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next-engine-sales

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-stock.txt

      - name: Run summary
        env:
          NE_ACCESS_TOKEN:  ${{ secrets.NE_ACCESS_TOKEN }}
          NE_REFRESH_TOKEN: ${{ secrets.NE_REFRESH_TOKEN }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          STOCK_SPREADSHEET_ID: 1Cqd62TbT_aB_dsL8CGpyeysRlKAn4nH7wrss9CWDiJw
          SHIP_SINCE: ${{ inputs.since }}
          SHIP_UNTIL: ${{ inputs.until }}
          NE_TOKEN_OUTPUT: /tmp/ne_tokens.json
        run: python ship_summary.py

      - name: Refresh NE tokens in Secrets
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -f /tmp/ne_tokens.json ]; then
            gh secret set NE_ACCESS_TOKEN --body "$(jq -r .access_token /tmp/ne_tokens.json)"
            gh secret set NE_REFRESH_TOKEN --body "$(jq -r .refresh_token /tmp/ne_tokens.json)"
            echo "NEトークンをSecretsに更新しました"
          fi
